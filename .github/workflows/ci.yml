name: CI

# PR：跑全部测试 + build 镜像（不推 GHCR）。
# master / v* tag：跑全部测试，测试通过后才 build 并 push 到 ghcr.io/moderras/duolinzao。
# 注意：镜像名必须全小写，所以是 moderras 而不是 ModerRAS。
on:
  push:
    branches: [master, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/moderras/duolinzao

jobs:
  test:
    name: 后端测试（cargo test + 一期集成测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Actions 里没有 peer 套接字，走 TCP；测试库由测试自己 CREATE DATABASE。
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/duolinzao_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 系统依赖（webauthn-rs → openssl-sys 需要 pkg-config + libssl-dev）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: clippy
        run: cargo clippy --all-targets
      - name: cargo test
        run: cargo test

  e2e:
    name: 浏览器测试（Playwright + Postgres + app）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duolinzao
          POSTGRES_PASSWORD: duolinzao
          POSTGRES_DB: duolinzao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duolinzao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://duolinzao:duolinzao@127.0.0.1:5432/duolinzao
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - name: 系统依赖（openssl-sys 与 Playwright 浏览器）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: 构建前端（app 的 static_dir 指向 web/dist）
        run: cd web && npm ci && npm run build
      - name: 构建后端
        run: cargo build
      - name: 安装 Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: 起栈并跑浏览器测试
        run: bash scripts/e2e.sh
      - name: 失败时上传浏览器报告（截图 / trace / video）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-log
          path: |
            e2e/app.log
            e2e/.tmp/config.toml
          if-no-files-found: ignore
          retention-days: 7

  e2e-scale:
    name: 规模化旅程 smoke（@scale，3 食堂 × 30 人）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duolinzao
          POSTGRES_PASSWORD: duolinzao
          POSTGRES_DB: duolinzao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duolinzao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://duolinzao:duolinzao@127.0.0.1:5432/duolinzao
      DLZ_SCALE: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-scale
      - name: 系统依赖（openssl-sys 与 Playwright 浏览器）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: 构建前端（app 的 static_dir 指向 web/dist）
        run: cd web && npm ci && npm run build
      - name: 构建后端
        run: cargo build
      - name: 安装 Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: 起栈并跑规模化旅程（DLZ_SCALE=smoke）
        run: bash scripts/e2e.sh
      - name: 失败时上传浏览器报告（截图 / trace / video）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-scale
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scale-app-log
          path: |
            e2e/app.log
            e2e/.tmp/config.toml
          if-no-files-found: ignore
          retention-days: 7

  android-apk:
    name: 构建 Android APK（未签通用包，prod/staging 各一份）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode 用 git rev-list --count HEAD，必须完整历史。
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 SDK 包
        run: |
          set -euo pipefail
          # runner 预装 cmdline-tools（同 android.yml 的做法）。ANDROID_HOME 由 runner 环境提供。
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # yes 被 SIGPIPE 打断时退出码是 141：关掉 pipefail，只认 sdkmanager 自己的退出码。
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
      - name: 算版本（versionName=Gitea 串，versionCode=提交计数单调递增）
        id: ver
        run: |
          set -euo pipefail
          VER="$(bash scripts/ci-version.sh)"
          CODE="$(git rev-list --count HEAD)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "APK 版本：${VER}（${CODE}）"
      - name: assembleRelease（未签通用包；正式签名在服务端完成）
        working-directory: clients/android
        run: ./gradlew :app:assembleRelease -PdlzVersionCode='${{ steps.ver.outputs.code }}' -PdlzVersionName='${{ steps.ver.outputs.version }}' --stacktrace
      - name: 按环境改包（prod/staging）并生成临时 version.json
        env:
          PROD_DOMAIN: ${{ vars.DLZ_DOMAIN }}
          STAGING_DOMAIN: ${{ vars.STAGING_DLZ_DOMAIN }}
        run: |
          set -euo pipefail
          # 无签名配置的 release 产物名为 app-release-unsigned.apk。
          # 签名材料只活在应用数据库（超管上传），CI 不碰任何 keystore，绿不依赖 secrets。
          UNIVERSAL="clients/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          PROD_URL="https://${PROD_DOMAIN:-}"
          if [ -z "${PROD_DOMAIN:-}" ]; then
            echo "::notice::仓库级 var DLZ_DOMAIN 未设，prod 包用 https://example.com 占位"
            PROD_URL="https://example.com"
          fi
          STAGING_URL="https://${STAGING_DOMAIN:-}"
          if [ -z "${STAGING_DOMAIN:-}" ]; then
            echo "::notice::仓库级 var STAGING_DLZ_DOMAIN 未设，staging 包用 https://example.com 占位"
            STAGING_URL="https://example.com"
          fi
          rm -rf app-bundle && mkdir -p app-bundle/prod app-bundle/staging
          bash clients/android/scripts/inject-server-url.sh "$PROD_URL" "$UNIVERSAL" app-bundle/prod/duolinzao.apk
          bash clients/android/scripts/inject-server-url.sh "$STAGING_URL" "$UNIVERSAL" app-bundle/staging/duolinzao.apk
          ls -la app-bundle/prod app-bundle/staging
      - name: 上传产物（供 image job 打进镜像）
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app-bundle/
          retention-days: 7

  image:
    name: 构建镜像（仅 master / v* 推 GHCR）
    runs-on: ubuntu-latest
    needs: [test, e2e, android-apk]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 页脚版本要跑 `git describe`，必须拿到完整历史与 tag。
          fetch-depth: 0
      - name: 取 APK 产物（CI 未签包；正式签名在服务端完成）
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: deploy/app-bundle
      - uses: docker/setup-buildx-action@v3
      - name: 校验 docker compose 可解析
        run: |
          cp config.docker.example.toml config.docker.toml
          docker compose -f docker-compose.yml config -q
      - name: 登录 GHCR
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成 tag / label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # master 推送：sha-<commit> 供 Swarm 按不可变 tag 部署，latest 跟踪最新稳定。
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - name: 算页脚版本（Gitea 风格 describe 串，供 Rust 编译期注入）
        id: ver
        run: |
          set -euo pipefail
          # 与 android-apk job 同算法（scripts/ci-version.sh），避免两处漂移。
          VER="$(bash scripts/ci-version.sh)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "页脚版本：${VER}（算法见 scripts/ci-version.sh，与 android-apk job 同一份）"
      - name: build（PR 只 build；master / v* 才 push）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DLZ_VERSION=${{ steps.ver.outputs.version }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟：APK 与 version.json 随镜像直出
        run: |
          set -euo pipefail
          # 与上一步同上下文再 build 一次 --load（复用 gha cache，不重编后端），
          # 只为把镜像拉到本地验证；PR 照样跑。
          docker buildx build --load -t dlz-apk-smoke:ci \
            --build-arg DLZ_VERSION='${{ steps.ver.outputs.version }}' \
            --build-arg GITHUB_SHA='${{ github.sha }}' \
            --cache-from type=gha \
            .
          # CI 包是未签的（signing 应为 unsigned）；正式签名在服务端完成，冒烟只验自洽。
          docker run --rm --entrypoint /bin/sh dlz-apk-smoke:ci -c 'ls -la /app/static/app/ /app/static/app-staging/'
          docker run --rm --entrypoint /bin/sh dlz-apk-smoke:ci -c 'cat /app/static/app/version.json' | tee /tmp/version.json
          jq -e '.versionCode > 0 and (.sha256 | length == 64) and (.url | startswith("/app/")) and .signing == "unsigned"' /tmp/version.json
          SHA_JSON="$(jq -r .sha256 /tmp/version.json)"
          SHA_APK="$(docker run --rm --entrypoint sha256sum dlz-apk-smoke:ci /app/static/app/duolinzao.apk | cut -d' ' -f1)"
          [ "$SHA_JSON" = "$SHA_APK" ] || { echo "sha 不一致：json=$SHA_JSON apk=$SHA_APK"; exit 1; }
          # staging 份同样自洽（version.json 合法、包存在）。
          docker run --rm --entrypoint /bin/sh dlz-apk-smoke:ci -c 'cat /app/static/app-staging/version.json' | \
            jq -e '.versionCode > 0 and (.sha256 | length == 64) and (.url | startswith("/app/"))'
          docker run --rm --entrypoint /bin/sh dlz-apk-smoke:ci -c 'test -s /app/static/app-staging/duolinzao.apk && echo STAGING_APK_OK'
          # 服务端签名工具链自带（超管「签名发布」用）：
          docker run --rm --entrypoint apksigner dlz-apk-smoke:ci --version
          echo "APK 冒烟通过"

  deploy:
    name: 部署到 Swarm（production）
    runs-on: ubuntu-latest
    needs: [test, e2e, e2e-scale, image]
    # 仅主仓 master push；fork 与 PR 永不触发。服务器上只部署，严禁 build。
    if: github.repository == 'ModerRAS/duolinzao' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    env:
      # 镜像 tag 与 image job 的 `sha-<commit>` 对齐；域名等走 repo vars（空则用 stack 默认值）。
      IMAGE_TAG: sha-${{ github.sha }}
      DLZ_DOMAIN: ${{ vars.DLZ_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: 算配置版本（config.toml sha256 前 12 位，config 改名即触发服务更新）
        run: echo "CONFIG_VERSION=$(sha256sum deploy/config.toml | cut -c1-12)" >> "$GITHUB_ENV"
      - name: 准备 SSH（key + known_hosts，强制校验主机密钥）
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: 同步 stack 文件到 manager
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          SSH "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            deploy/stack.yml deploy/config.toml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
      - name: 拉镜像并发版（start-first，失败自动 rollback）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          TRAEFIK_ENTRYPOINT: ${{ vars.TRAEFIK_ENTRYPOINT }}
          TRAEFIK_CERTRESOLVER: ${{ vars.TRAEFIK_CERTRESOLVER }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          # 私有/限流时先登录（可选 secret，有则用）。token 走 stdin，不拼进远端命令行。
          if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
            printf '%s' "$GHCR_PULL_TOKEN" | SSH "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          fi
          SSH "cd '${DEPLOY_PATH}' && DEPLOY_PATH='${DEPLOY_PATH}' IMAGE_TAG='${IMAGE_TAG}' DLZ_DOMAIN='${DLZ_DOMAIN:-}' TRAEFIK_ENTRYPOINT='${TRAEFIK_ENTRYPOINT:-}' TRAEFIK_CERTRESOLVER='${TRAEFIK_CERTRESOLVER:-}' TRAEFIK_NETWORK='${TRAEFIK_NETWORK:-}' CONFIG_VERSION='${CONFIG_VERSION}' docker stack deploy -c stack.yml --with-registry-auth duolinzao"
      - name: 等 duolinzao_app 收敛到新镜像（超时失败）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          WANT="ghcr.io/moderras/duolinzao:${IMAGE_TAG}"
          for _ in $(seq 1 40); do
            STATE="$(SSH "docker service inspect duolinzao_app --format '{{.UpdateStatus.State}}'" 2>/dev/null || true)"
            SPEC="$(SSH "docker service inspect duolinzao_app --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'" 2>/dev/null || true)"
            # Swarm 解析后 Image 常为 tag@sha256:...，不能与 WANT 精确相等。
            RUNNING="$(SSH "docker service ps duolinzao_app --filter desired-state=running --format '{{.Image}} {{.CurrentState}}'" 2>/dev/null | grep -c "^${WANT}\(@[^ ]*\)\? .*Running" || true)"
            RUNNING="${RUNNING:-0}"
            echo "update=${STATE} spec=${SPEC} running=${RUNNING}"
            case "${STATE}" in
              *rollback*|*paused*) echo "更新失败：${STATE}"; exit 1;;
            esac
            SPEC_OK=0
            case "${SPEC}" in
              "${WANT}"|"${WANT}"@*) SPEC_OK=1 ;;
            esac
            if { [ "${SPEC_OK}" -eq 1 ] || [ "${RUNNING}" -ge 1 ]; } && [ "${RUNNING}" -ge 1 ]; then
              echo CONVERGED
              exit 0
            fi
            sleep 15
          done
          echo "收敛超时"; exit 1
      - name: 公网健康检查 https://域名/healthz（带重试）
        run: |
          set -euo pipefail
          DOMAIN="${DLZ_DOMAIN:-example.com}"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${DOMAIN}/healthz"; then
              echo; echo HEALTHY
              exit 0
            fi
            sleep 10
          done
          echo "健康检查失败"; exit 1
      - name: 清理旧镜像
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "docker image prune -f"

  deploy-staging:
    name: 部署到测试服（staging，自动）
    runs-on: ubuntu-latest
    needs: [test, e2e, e2e-scale, image]
    # 仅主仓 master push；fork 与 PR 永不触发。测试服与生产同 manager、同集群、独立 stack。
    if: github.repository == 'ModerRAS/duolinzao' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment: staging
    env:
      # 镜像 tag 与 image job 的 `sha-<commit>` 对齐；域名/目录走 staging vars/secrets。
      IMAGE_TAG: sha-${{ github.sha }}
      DLZ_DOMAIN: ${{ vars.STAGING_DLZ_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查 staging 配置（缺则跳过，不染红 master）
        id: guard
        env:
          STAGING_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_SUPER: ${{ secrets.STAGING_SUPER_PASSWORD }}
          PROD_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_PATH:-}" ] || [ -z "${STAGING_SUPER:-}" ] || [ -z "${DLZ_DOMAIN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::staging 未配置（STAGING_DEPLOY_PATH / STAGING_SUPER_PASSWORD secret 或 STAGING_DLZ_DOMAIN var 缺失），跳过测试服部署"
            exit 0
          fi
          # PROD_PATH 是 production 环境的 secret，在 staging 环境里不可见则为空，此时静默放过。
          if [ -n "${PROD_PATH:-}" ] && [ "${STAGING_PATH}" = "${PROD_PATH}" ]; then
            echo "::error::STAGING_DEPLOY_PATH 与生产 DEPLOY_PATH 相同，拒绝部署（会覆盖生产数据）"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: 算配置版本（config.staging.toml sha256 前 12 位）
        if: steps.guard.outputs.ready == 'true'
        run: echo "CONFIG_VERSION=$(sha256sum deploy/config.staging.toml | cut -c1-12)" >> "$GITHUB_ENV"
      - name: 准备 SSH（key + known_hosts，强制校验主机密钥）
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: 确保 staging secrets 存在（缺才建，绝不重建已有）
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STAGING_SUPER_PASSWORD: ${{ secrets.STAGING_SUPER_PASSWORD }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          # 远端生成随机值依赖 openssl，没有就直说（不静默降级）。
          if ! SSH "command -v openssl >/dev/null 2>&1"; then
            echo "::error::manager 上缺少 openssl，无法生成 staging secret（db 密码/local_key 需要它）"
            exit 1
          fi
          # 超管密码来自 GitHub：已存在就跳过（stdin 被丢弃），缺才建；值只走 stdin，
          # 不出现在远端命令行、不 echo、不写 GITHUB_ENV/OUTPUT（GitHub 已自动 mask secrets）。
          if SSH "docker secret inspect dlz_stg_super_password >/dev/null 2>&1"; then
            echo "dlz_stg_super_password: exists"
          else
            printf '%s' "$STAGING_SUPER_PASSWORD" | SSH "docker secret create dlz_stg_super_password - >/dev/null"
            echo "dlz_stg_super_password: created"
          fi
          # 其余四个在远端一次会话里幂等处理：heredoc 单引号防 runner 侧展开，
          # 远端 set -euo pipefail、不开 set -x；只打印 created/exists，不打印值。
          # docker secret 不可变：已存在的 db 密码绝不重建，否则和已有 pgdata 对不上。
          SSH 'bash -s' <<'REMOTE'
          set -euo pipefail
          have() { docker secret inspect "$1" >/dev/null 2>&1; }
          if have dlz_stg_db_password && have dlz_stg_database_url; then
            echo "dlz_stg_db_password: exists"
            echo "dlz_stg_database_url: exists"
          elif have dlz_stg_db_password || have dlz_stg_database_url; then
            echo "::error::dlz_stg_db_password 与 dlz_stg_database_url 必须成对存在（一有一无），请按文档重置 staging，不要自动生成新的"
            exit 1
          else
            PW="$(openssl rand -hex 24)"
            printf '%s' "$PW" | docker secret create dlz_stg_db_password - >/dev/null
            printf '%s' "postgres://duolinzao:${PW}@db:5432/duolinzao" | docker secret create dlz_stg_database_url - >/dev/null
            echo "dlz_stg_db_password: created"
            echo "dlz_stg_database_url: created"
          fi
          if have dlz_stg_local_key; then
            echo "dlz_stg_local_key: exists"
          else
            openssl rand -base64 32 | tr -d '\n' | docker secret create dlz_stg_local_key - >/dev/null
            echo "dlz_stg_local_key: created"
          fi
          if have dlz_stg_smtp_password; then
            echo "dlz_stg_smtp_password: exists"
          else
            printf '%s' 'unused' | docker secret create dlz_stg_smtp_password - >/dev/null
            echo "dlz_stg_smtp_password: created"
          fi
          REMOTE
      - name: 同步 stack 文件到 manager
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          SSH "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            deploy/stack.staging.yml deploy/config.staging.toml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          # manager 侧文件名统一为 stack.yml / config.toml，deploy 命令与生产同形。
          SSH "cd '${DEPLOY_PATH}' && mv -f stack.staging.yml stack.yml && mv -f config.staging.toml config.toml"
      - name: 拉镜像并发版（start-first，失败自动 rollback）
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          TRAEFIK_ENTRYPOINT: ${{ vars.TRAEFIK_ENTRYPOINT }}
          TRAEFIK_CERTRESOLVER: ${{ vars.TRAEFIK_CERTRESOLVER }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
            printf '%s' "$GHCR_PULL_TOKEN" | SSH "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          fi
          SSH "cd '${DEPLOY_PATH}' && DEPLOY_PATH='${DEPLOY_PATH}' IMAGE_TAG='${IMAGE_TAG}' DLZ_DOMAIN='${DLZ_DOMAIN:-}' TRAEFIK_ENTRYPOINT='${TRAEFIK_ENTRYPOINT:-}' TRAEFIK_CERTRESOLVER='${TRAEFIK_CERTRESOLVER:-}' TRAEFIK_NETWORK='${TRAEFIK_NETWORK:-}' CONFIG_VERSION='${CONFIG_VERSION}' docker stack deploy -c stack.yml --with-registry-auth duolinzao-staging"
      - name: 等 duolinzao-staging_app 收敛到新镜像（超时失败）
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          WANT="ghcr.io/moderras/duolinzao:${IMAGE_TAG}"
          for _ in $(seq 1 40); do
            STATE="$(SSH "docker service inspect duolinzao-staging_app --format '{{.UpdateStatus.State}}'" 2>/dev/null || true)"
            SPEC="$(SSH "docker service inspect duolinzao-staging_app --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'" 2>/dev/null || true)"
            RUNNING="$(SSH "docker service ps duolinzao-staging_app --filter desired-state=running --format '{{.Image}} {{.CurrentState}}'" 2>/dev/null | grep -c "^${WANT}\(@[^ ]*\)\? .*Running" || true)"
            RUNNING="${RUNNING:-0}"
            echo "update=${STATE} spec=${SPEC} running=${RUNNING}"
            case "${STATE}" in
              *rollback*|*paused*) echo "更新失败：${STATE}"; exit 1;;
            esac
            SPEC_OK=0
            case "${SPEC}" in
              "${WANT}"|"${WANT}"@*) SPEC_OK=1 ;;
            esac
            if { [ "${SPEC_OK}" -eq 1 ] || [ "${RUNNING}" -ge 1 ]; } && [ "${RUNNING}" -ge 1 ]; then
              echo CONVERGED
              exit 0
            fi
            sleep 15
          done
          echo "收敛超时"; exit 1
      - name: 公网健康检查 https://staging 域名/healthz（带重试）
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          DOMAIN="${DLZ_DOMAIN:-example.com}"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${DOMAIN}/healthz"; then
              echo; echo HEALTHY
              exit 0
            fi
            sleep 10
          done
          echo "健康检查失败"; exit 1
