name: Android 客户端（assemble）

# 不挡后端/浏览器主 CI：本 workflow 只在客户端路径变更、手动或定时跑，
# 失败不阻塞 master 必过检查（主 CI 见 ci.yml）。
on:
  push:
    branches: ["ci/**", "feat/android-client"]
    paths: ["clients/android/**"]
  pull_request:
    paths: ["clients/android/**"]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: 安装 SDK 包
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses > /dev/null
      - name: assembleDebug
        working-directory: clients/android
        run: ./gradlew :app:assembleDebug --stacktrace

  ui-test:
    # mock 冒烟（不连真后端），与 assemble 并行；不进主 ci.yml needs，不挡后端主 CI。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: 安装 SDK 包
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-30" "build-tools;35.0.0" "emulator" "system-images;android-30;google_apis;x86_64"
          yes | "$SDKMANAGER" --licenses > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器跑 Compose 冒烟测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: cd clients/android && ./gradlew :app:connectedDebugAndroidTest --stacktrace
