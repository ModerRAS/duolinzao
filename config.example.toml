# 多邻灶配置示例。REPLACE_ME 与空值会导致进程拒绝启动。
# 钟点、阈值、样本量、图片上限和密钥由部署方填写，不要写进代码。
# 不要把真实密钥提交到仓库。复制为 config.toml 后再填写。

[super_admin]
username = "REPLACE_ME"
password = "REPLACE_ME"

[webauthn]
rp_id = "REPLACE_ME"
rp_origin = "REPLACE_ME"
rp_name = "多邻灶"

[email]
enabled = false

[smtp]
host = ""
port = 587
username = ""
password = ""
from = ""

[schedule]
lock_time = "REPLACE_ME"
breakfast_after = "REPLACE_ME"
lunch_after = "REPLACE_ME"
dinner_after = "REPLACE_ME"

[score_alert]
mean_threshold = "REPLACE_ME"
min_samples = "REPLACE_ME"

[crypto]
local_key = "REPLACE_ME"

[dish_image]
dir = "REPLACE_ME"
max_bytes = "REPLACE_ME"

[server]
bind = "0.0.0.0:8080"
# 管理回环端口：只挂 /readyz 就绪探针。缺省 127.0.0.1:8090（只绑回环，外部到不了）；
# 边界靠绑定地址实现，不判 IP、不加 token。如需改地址再显式配置。
# admin_bind = "127.0.0.1:8090"
# 生产必须 true：即使后端容器只听 HTTP（TLS 由 Traefik/Swarm 网关终结），
# 浏览器也只在 HTTPS 下回送 Secure Cookie。仅本地 HTTP 直连开发或 e2e 才改为 false。
cookie_secure = true
# 反代可信开关：缺省 false，直接取对端地址。生产在 Traefik 后面才配 true，
# 此时只信一层 X-Forwarded-For 首段 / Forwarded 首个 for=，用于限流与审计记 IP。
# Traefik 侧必须设置 X-Forwarded-For（entryPoints.proxyProtocol 或 forwardedHeaders），
# 否则所有请求都会记成网关 IP，限流会误伤。开关关闭时绝不读这些头，防客户端伪造。
trust_proxy = false
static_dir = ""
# 启动自动签名（A 方案）：进程就绪后若镜像里是未签包且库里已有 keystore，自动签名发布。
# 缺省 true；改 false 则每次部署后都要超管手动点「签名发布」。也可用 DLZ_APK_AUTO_SIGN=false 关。
# apk_auto_sign = true

[database]
url = "postgres://duolinzao:duolinzao@127.0.0.1:5432/duolinzao"
